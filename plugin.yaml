description: RTK integration for Hermes Agent — compress terminal outputs, save 60-90% tokens
license: Apache-2.0
author: Kim Hsiao
kind: standalone
hermes_version: ">=0.11"
hooks:
  - transform_terminal_output
config_defaults:
  enabled: true
  verbose: false
  rtk_path: "rtk"
  exclude_commands: []
