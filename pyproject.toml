[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-rtkit"
version = "0.1.0"
description = "RTK Integration for Hermes Agent - compress terminal output, save 60-90% tokens"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = ["rtk", "hermes", "token-compression", "cli", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.12",
]

[project.urls]
Homepage = "https://github.com/kimhsiao/hermes-rtkit"
Repository = "https://github.com/kimhsiao/hermes-rtkit"

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_rtkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"

[tool.coverage.run]
source = ["src/hermes_rtkit"]
branch = true
